<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   家計簿  — 設定はこのファイル末尾の script 部分の冒頭にまとめてあります
   （費目の並び、よく使うメモ）。見た目はここの CSS。
   ============================================================ */
:root{
  --paper:#FFFDF7;
  --ink:#1E2A22;
  --muted:#5C6A60;
  --line:#D5DCD2;
  --green:#2B7A4B;
  --green-deep:#1E5A37;
  --green-soft:#E4F1E8;
  --yellow:#FFE27A;
  --yellow-deep:#E5B93A;
  --red:#B42318;
  --red-soft:#FCEBE9;
  --radius:14px;
  --fs:19px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","BIZ UDPゴシック","Meiryo","メイリオ","Yu Gothic UI","Hiragino Sans",sans-serif;
  line-height:1.5;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--yellow-deep);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- ヘッダー ---------- */
.top{
  display:flex;align-items:center;gap:1rem;
  padding:.4rem 1.4rem;background:var(--green);color:#fff;
}
.top h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:.06em}
.tabs{display:flex;gap:.4rem;margin-left:1rem}
.tab{
  min-height:50px;padding:0 1.4rem;border-radius:999px;font-size:1.1rem;font-weight:700;
  color:#fff;background:rgba(255,255,255,.14);
}
.tab[aria-selected="true"]{background:#fff;color:var(--green-deep)}
.spacer{flex:1}
.pill{
  min-height:44px;padding:0 1rem;border-radius:999px;font-size:.9rem;font-weight:700;
  background:var(--yellow);color:var(--ink);
}
.pill[hidden]{display:none}
.gear{min-height:44px;padding:0 .8rem;border-radius:999px;color:#fff;font-size:.9rem;opacity:.9}

main{max-width:1180px;margin:0 auto;padding:.7rem 1.4rem 3rem}
section[hidden]{display:none}

/* ---------- 入力 ---------- */
.step{
  display:flex;align-items:center;gap:.6rem;margin:0 0 .4rem;
  font-size:1.05rem;font-weight:700;
}
.step .n{
  display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;
  background:var(--green);color:#fff;font-size:1rem;
}
.step .hint{font-weight:400;color:var(--muted);font-size:.9rem;margin-left:.2rem}

.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.6rem;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

.daterow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.chip{
  min-height:56px;padding:0 1.1rem;border-radius:var(--radius);
  background:#fff;border:2px solid var(--line);font-size:1.05rem;font-weight:700;
}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow-deep)}
.chip.small{min-height:46px;font-size:.95rem;font-weight:400;padding:0 .8rem}
.datepick{
  min-height:56px;padding:0 .8rem;border-radius:var(--radius);
  border:2px solid var(--line);background:#fff;font-size:1rem;
}
.datebig{font-size:1.2rem;font-weight:700;margin-left:.4rem;color:var(--green-deep)}

.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
@media (max-width:1000px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{
  min-height:60px;padding:.3rem .4rem;border-radius:var(--radius);
  background:#fff;border:2px solid var(--line);font-size:1.02rem;font-weight:700;
  line-height:1.2;text-align:center;overflow-wrap:anywhere;
}
.cat:hover{border-color:var(--green)}
.cat[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow-deep)}
.cat[aria-pressed="true"]::before{content:"✓ ";color:var(--green-deep)}

.amountbox{
  display:flex;align-items:center;gap:.6rem;background:#fff;border:2px solid var(--line);
  border-radius:var(--radius);padding:.15rem .9rem .15rem 1rem;margin-bottom:.5rem;
}
.amountbox .yen{font-size:1.6rem;color:var(--muted)}
#amount{
  flex:1;min-width:0;border:0;background:none;text-align:right;
  font-size:2.3rem;font-weight:700;padding:0;font-variant-numeric:tabular-nums;
}
#amount::placeholder{color:#B7C0B9;font-weight:400}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem;margin-bottom:1rem}
.key{
  min-height:52px;border-radius:var(--radius);background:#fff;border:2px solid var(--line);
  font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;
}
.key.fn{font-size:1.05rem;background:var(--green-soft);border-color:#C6DCCC}
.key:active{background:var(--yellow)}

#memo{
  width:100%;min-height:56px;padding:0 1rem;border-radius:var(--radius);
  border:2px solid var(--line);background:#fff;font-size:1.1rem;
}
.memochips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 1rem}

.save{
  width:100%;min-height:72px;border-radius:18px;background:var(--green);color:#fff;
  font-size:1.6rem;font-weight:700;letter-spacing:.2em;
  box-shadow:0 4px 0 var(--green-deep);
}
.save:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-deep)}
.save[disabled]{opacity:.55;box-shadow:none;transform:none;cursor:default}
.problem{
  margin:.7rem 0 0;padding:.7rem 1rem;border-radius:var(--radius);
  background:var(--red-soft);color:var(--red);font-weight:700;
}
.problem[hidden]{display:none}

.banner{
  margin:1.4rem 0 0;padding:1rem 1.2rem;border-radius:var(--radius);
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;font-size:1.15rem;font-weight:700;
}
.banner[hidden]{display:none}
.banner.ok{background:var(--green-soft);border:2px solid var(--green)}
.banner.wait{background:#FFF6D6;border:2px solid var(--yellow-deep)}
.banner.bad{background:var(--red-soft);border:2px solid var(--red);color:var(--red)}
.banner .txt{flex:1;min-width:0}

.recent{margin-top:1.6rem}
.recent h2,.sum h2{font-size:1.15rem;margin:0 0 .6rem}
table{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--line);border-radius:var(--radius);overflow:hidden}
th,td{padding:.6rem .8rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--green-soft);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{width:12rem;text-align:right;white-space:nowrap}
.undo{min-height:46px;padding:0 1rem;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:.95rem}
.undo.yes{background:var(--red);color:#fff;border-color:var(--red)}
.undo.no{background:var(--green-soft)}
.ask{color:var(--red);font-weight:700;margin-right:.4rem;font-size:.95rem}
.empty{color:var(--muted);padding:1rem;background:#fff;border:2px dashed var(--line);border-radius:var(--radius)}

/* ---------- 集計 ---------- */
.monthnav{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;flex-wrap:wrap}
.monthnav .title{font-size:1.6rem;font-weight:700;min-width:11rem;text-align:center}
.total{
  display:flex;align-items:baseline;gap:.6rem;background:#fff;border:2px solid var(--green);
  border-radius:var(--radius);padding:.8rem 1.2rem;margin-bottom:1.4rem;
}
.total .lab{font-weight:700}
.total .val{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.total .cnt{color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-bottom:1.6rem}
@media (max-width:900px){.sumgrid{grid-template-columns:1fr}}
.bar{display:block;height:.55rem;background:var(--green);border-radius:4px;margin-top:.3rem;min-width:2px}
.sum details{background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:.6rem 1rem;margin-top:1.2rem}
.sum summary{font-size:1.15rem;font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
.sum details table{border:0;margin-top:.6rem}
.loading{color:var(--muted);padding:1rem}

/* ---------- 設定 ---------- */
.set{max-width:720px}
.set label{display:block;font-weight:700;margin:1rem 0 .3rem}
.set input{width:100%;min-height:56px;padding:0 1rem;border:2px solid var(--line);border-radius:var(--radius);background:#fff;font-size:1rem}
.set .note{color:var(--muted);font-size:.9rem}
.btn{min-height:60px;padding:0 1.4rem;border-radius:var(--radius);background:var(--green);color:#fff;font-weight:700;font-size:1.05rem;margin-top:1.2rem}
.btn.plain{background:#fff;color:var(--ink);border:2px solid var(--line)}
.status{margin-top:1rem;padding:.8rem 1rem;border-radius:var(--radius);font-weight:700}
.status.ok{background:var(--green-soft)}
.status.bad{background:var(--red-soft);color:var(--red)}
.status[hidden]{display:none}
</style>
</head>
<body>

<header class="top">
  <h1>家計簿</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-input" aria-selected="true" aria-controls="view-input">入力</button>
    <button class="tab" role="tab" id="tab-sum" aria-selected="false" aria-controls="view-sum">集計を見る</button>
  </div>
  <div class="spacer"></div>
  <button class="pill" id="pendingPill" hidden></button>
  <button class="gear" id="tab-set" aria-controls="view-set">設定</button>
</header>

<main>

<!-- ================= 入力 ================= -->
<section id="view-input" role="tabpanel" aria-labelledby="tab-input">

  <div class="grid2">
    <div>
      <p class="step"><span class="n">1</span>日付 <span class="datebig" id="dateBig"></span><span class="hint">今日ならそのままで大丈夫</span></p>
      <div class="daterow">
        <button class="chip" data-day="0" aria-pressed="true">今日</button>
        <button class="chip" data-day="1" aria-pressed="false">昨日</button>
        <button class="chip" data-day="2" aria-pressed="false">おととい</button>
        <input class="datepick" type="date" id="datepick" aria-label="他の日を選ぶ">
      </div>
      <p class="step"><span class="n">2</span>費目 <span class="hint">ひとつ選ぶ</span></p>
      <div class="cats" id="cats"></div>
    </div>
    <div>
      <p class="step"><span class="n">3</span>金額</p>
      <div class="amountbox">
        <span class="yen">¥</span>
        <input id="amount" type="text" inputmode="numeric" placeholder="0" autocomplete="off" aria-label="金額">
      </div>
      <div class="keypad" id="keypad">
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button><button class="key fn" data-k="bs">1字消す</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button><button class="key fn" data-k="clr">全部消す</button>
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button><button class="key" data-k="000">000</button>
        <button class="key" data-k="0" style="grid-column:span 2">0</button><button class="key" data-k="00" style="grid-column:span 2">00</button>
      </div>

      <p class="step"><span class="n">4</span>メモ <span class="hint">お店の名前など。なくても大丈夫</span></p>
      <input id="memo" type="text" placeholder="例：コープ、タクシー" autocomplete="off">
      <div class="memochips" id="memochips"></div>

      <button class="save" id="saveBtn">保 存</button>
      <p class="problem" id="problem" hidden></p>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="recent">
    <h2>さいきん入力したもの</h2>
    <div id="recentBox"></div>
  </div>
</section>

<!-- ================= 集計 ================= -->
<section id="view-sum" class="sum" role="tabpanel" aria-labelledby="tab-sum" hidden>
  <div class="monthnav">
    <button class="chip" id="prevMonth">◀ 前の月</button>
    <span class="title" id="monthTitle"></span>
    <button class="chip" id="nextMonth">次の月 ▶</button>
    <button class="chip small" id="thisMonth">今月にもどる</button>
  </div>
  <div id="sumBody"><p class="loading">読み込み中…</p></div>
</section>

<!-- ================= 設定 ================= -->
<section id="view-set" class="set" role="tabpanel" hidden>
  <h2>設定（息子さんが設定します）</h2>
  <p class="note">保存先はGitHubの非公開リポジトリです。この設定はこのパソコンのブラウザにだけ保存され、外には出ません。</p>
  <label for="owner">GitHubのユーザー名</label>
  <input id="owner" placeholder="例：shimoyan">
  <label for="repo">データ用リポジトリ名</label>
  <input id="repo" placeholder="例：kakeibo-data">
  <label for="branch">ブランチ</label>
  <input id="branch" placeholder="main">
  <label for="token">アクセストークン（github_pat_ で始まるもの）</label>
  <input id="token" type="password" autocomplete="off">
  <p class="note">トークンには有効期限があります。期限が切れると保存できなくなるので、新しいものを作ってここに貼り直します。</p>
  <button class="btn" id="saveSettings">保存して接続を確認</button>
  <button class="btn plain" id="flushNow">未送信のものを今すぐ送る</button>
  <p class="status" id="setStatus" hidden></p>
  <p class="note" style="margin-top:2rem">費目の並びや「よく使うメモ」を変えたいときは、この index.html の先頭にある CATEGORIES と MEMO_CHIPS を書き換えます。</p>
</section>

</main>

<script>
/* ============================================================
   ▼ ここだけ触れば大体のことは変えられます
   ============================================================ */
const CATEGORIES = [
  "食費","住居備品費","日用雑貨費","不動産経費",
  "交際費","由美子へ","医療費（！）","車費",
  "衣服費","その他","お母さん","年金等",
  "ＶＩＳＡ支払い","税金","介護","保険.そのた",
  "銀行　引落し","臨時収入　株式等","相続費用　葬儀","公共料金"
];
const MEMO_CHIPS = ["TOP","イトーヨーカ堂","コープ","マツキヨ"];   // 4個までなら1行に収まる。増やすと画面が縦に伸びる
const DATA_DIR = "";               // CSVを置くフォルダ。リポジトリ直下なら "" 、data フォルダなら "data"
const RECENT_MAX = 8;
/* ============================================================ */

const HEADER = "id,日付,費目,金額,メモ,登録日時";
const API = "https://api.github.com";
const LS = { settings:"kakeibo.settings", pending:"kakeibo.pending", recent:"kakeibo.recent" };

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const yen = n => "¥" + Number(n).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2,"0");
const WD = ["日","月","火","水","木","金","土"];
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const jpDate = s => { const d = fromYmd(s); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const nowStamp = () => { const d=new Date(); return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const newId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6);
const load = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch { return fb; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let settings = load(LS.settings, {owner:"", repo:"", branch:"main", token:""});
let pending  = load(LS.pending, []);
let recent   = load(LS.recent, []);

/* ---------- CSV ---------- */
function csvField(v){ v = String(v ?? ""); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function toLine(e){ return [e.id, e.date, e.cat, e.amount, e.memo, e.created].map(csvField).join(","); }
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===","){ row.push(f); f=""; }
    else if (c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!=="\r") f+=c;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function rowsToEntries(text){
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const h = rows[0]; const ix = n => h.indexOf(n);
  const I = {id:ix("id"), date:ix("日付"), cat:ix("費目"), amount:ix("金額"), memo:ix("メモ"), created:ix("登録日時")};
  return rows.slice(1).filter(r => r.length>1 && r[I.date]).map(r => ({
    id:r[I.id], date:r[I.date], cat:r[I.cat], amount:Number(r[I.amount])||0, memo:r[I.memo]||"", created:r[I.created]||""
  }));
}

/* ---------- GitHub ---------- */
function b64decode(s){ const bin=atob(s.replace(/\s/g,"")); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder("utf-8").decode(b); }
function b64encode(str){ const b=new TextEncoder().encode(str); let bin=""; for (let i=0;i<b.length;i+=0x8000) bin+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(bin); }
function ghErr(status, msg){ const e=new Error(msg); e.status=status; return e; }
async function gh(path, opts={}){
  if (!settings.token || !settings.owner || !settings.repo) throw ghErr(0, "settings");
  let res;
  const url = API + path + (opts.method ? "" : (path.includes("?") ? "&" : "?") + "_=" + Date.now());   // 読み込みは毎回サーバーから
  try {
    res = await fetch(url, {
      cache: "no-store",
      ...opts,
      headers: { "Authorization":"Bearer "+settings.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(opts.headers||{}) }
    });
  } catch { throw ghErr(-1, "network"); }
  if (res.status===404) return null;
  if (!res.ok) throw ghErr(res.status, "github");
  return res.json();
}
const DIR = DATA_DIR ? DATA_DIR.replace(/^\/+|\/+$/g,"") + "/" : "";
const filePath = year => `/repos/${settings.owner}/${settings.repo}/contents/${DIR}${year}.csv`;
async function getFile(year){
  const j = await gh(filePath(year) + "?ref=" + encodeURIComponent(settings.branch||"main"));
  if (!j) return null;
  return { sha:j.sha, text:b64decode(j.content) };
}
async function putFile(year, text, sha, message){
  const body = { message, content:b64encode(text), branch:settings.branch||"main" };
  if (sha) body.sha = sha;
  return gh(filePath(year), { method:"PUT", body:JSON.stringify(body) });
}
const yearCache = {};   // year -> {entries, sha, text}
async function loadYear(year, force=false){
  if (!force && yearCache[year]) return yearCache[year].entries;
  const f = await getFile(year);
  const text = f ? f.text : "\uFEFF" + HEADER + "\n";
  yearCache[year] = { entries:rowsToEntries(text), sha:f?f.sha:null, text };
  return yearCache[year].entries;
}
async function appendEntries(year, entries){
  for (let attempt=1; attempt<=3; attempt++){
    const f = await getFile(year);
    let text = f ? f.text : "\uFEFF" + HEADER + "\n";
    if (!text.endsWith("\n")) text += "\n";
    text += entries.map(toLine).join("\n") + "\n";
    const msg = entries.length===1 ? `家計簿 ${entries[0].date} ${entries[0].cat} ${entries[0].amount}` : `家計簿 ${entries.length}件を追加`;
    try { await putFile(year, text, f?f.sha:null, msg); delete yearCache[year]; return; }
    catch(e){ if (e.status===409 && attempt<3) continue; throw e; }
  }
}
async function deleteEntry(year, id){
  for (let attempt=1; attempt<=3; attempt++){
    const f = await getFile(year);
    if (!f) return;
    const lines = f.text.replace(/^\uFEFF/,"").split("\n");
    const kept = lines.filter(l => !(l.startsWith(id + ",")));
    const text = "\uFEFF" + kept.join("\n");
    try { await putFile(year, text, f.sha, `家計簿 取り消し ${id}`); delete yearCache[year]; return; }
    catch(e){ if (e.status===409 && attempt<3) continue; throw e; }
  }
}

/* ---------- 画面切替 ---------- */
const views = { input:$("#view-input"), sum:$("#view-sum"), set:$("#view-set") };
function show(name){
  Object.entries(views).forEach(([k,el]) => el.hidden = (k!==name));
  $("#tab-input").setAttribute("aria-selected", name==="input");
  $("#tab-sum").setAttribute("aria-selected", name==="sum");
  if (name==="sum") renderSummary();
  if (name==="set") fillSettings();
  window.scrollTo(0,0);
}
$("#tab-input").onclick = () => show("input");
$("#tab-sum").onclick = () => show("sum");
$("#tab-set").onclick = () => show("set");

/* ---------- 入力：日付 ---------- */
let selDate = ymd(new Date());
function setDate(s){
  selDate = s;
  $("#dateBig").textContent = jpDate(s);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - fromYmd(s)) / 86400000);
  $$(".daterow .chip").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.day)===diff)));
  $("#datepick").value = s;
}
$$(".daterow .chip").forEach(b => b.onclick = () => { const d=new Date(); d.setDate(d.getDate()-Number(b.dataset.day)); setDate(ymd(d)); });
$("#datepick").onchange = e => { if (e.target.value) setDate(e.target.value); };
setDate(selDate);

/* ---------- 入力：費目 ---------- */
let selCat = "";
const catsEl = $("#cats");
CATEGORIES.forEach(c => {
  const b = document.createElement("button");
  b.className="cat"; b.textContent=c; b.setAttribute("aria-pressed","false");
  b.onclick = () => { selCat = (selCat===c) ? "" : c; $$(".cat").forEach(x => x.setAttribute("aria-pressed", String(x.textContent===selCat))); hideProblem(); if (selCat) $("#amount").focus(); };
  catsEl.appendChild(b);
});

/* ---------- 入力：金額 ---------- */
const amountEl = $("#amount");
function amountDigits(){ return amountEl.value.replace(/[^\d]/g,""); }
function setAmount(digits){
  digits = digits.replace(/^0+(?=\d)/,"").slice(0,9);
  amountEl.value = digits ? Number(digits).toLocaleString("ja-JP") : "";
}
amountEl.addEventListener("input", () => setAmount(amountEl.value.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[^\d]/g,"")));
amountEl.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); $("#memo").focus(); } });
$("#keypad").onclick = e => {
  const k = e.target.closest(".key")?.dataset.k; if (!k) return;
  const d = amountDigits();
  if (k==="bs") setAmount(d.slice(0,-1));
  else if (k==="clr") setAmount("");
  else setAmount(d + k);
  hideProblem();
};

/* ---------- 入力：メモ ---------- */
const memoEl = $("#memo");
memoEl.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); $("#saveBtn").click(); } });
const chipsEl = $("#memochips");
MEMO_CHIPS.forEach(m => {
  const b=document.createElement("button"); b.className="chip small"; b.textContent=m;
  b.onclick = () => { memoEl.value = m; memoEl.focus(); };
  chipsEl.appendChild(b);
});

/* ---------- 入力：保存 ---------- */
function showProblem(t){ const p=$("#problem"); p.textContent=t; p.hidden=false; }
function hideProblem(){ $("#problem").hidden=true; }
function banner(kind, text, undoEntry){
  const b=$("#banner"); b.className="banner "+kind; b.hidden=false; b.innerHTML="";
  const span=document.createElement("span"); span.className="txt"; span.textContent=text; b.appendChild(span);
  if (undoEntry){ const u=document.createElement("button"); u.className="undo"; u.textContent="取り消す"; u.onclick=()=>askUndo(u, undoEntry); b.appendChild(u); }
  clearTimeout(banner.t);
  if (kind==="ok") banner.t = setTimeout(() => { b.hidden=true; }, 15000);
}
$("#saveBtn").onclick = async () => {
  const digits = amountDigits();
  if (!selCat){ showProblem("費目を選んでください（左のボタンからひとつ）。"); return; }
  if (!digits || Number(digits)===0){ showProblem("金額を入れてください。"); amountEl.focus(); return; }
  hideProblem();
  const e = { id:newId(), date:selDate, cat:selCat, amount:Number(digits), memo:memoEl.value.trim(), created:nowStamp() };
  pending.push(e); store(LS.pending, pending);
  // 画面をすぐ次の入力に備える
  selCat=""; $$(".cat").forEach(x => x.setAttribute("aria-pressed","false"));
  setAmount(""); memoEl.value="";
  setDate(ymd(new Date()));
  banner("wait", `保存しています… ${jpDate(e.date)} ${e.cat} ${yen(e.amount)}`);
  await flushPending();
};
let flushing=false;
async function flushPending(){
  if (flushing) { return; } flushing=true;
  const btn=$("#saveBtn"); btn.disabled=true;
  try {
    while (pending.length){
      const year = pending[0].date.slice(0,4);
      const batch = pending.filter(p => p.date.slice(0,4)===year);
      await appendEntries(year, batch);
      batch.forEach(p => { recent.unshift(p); });
      recent = recent.slice(0, RECENT_MAX); store(LS.recent, recent);
      pending = pending.filter(p => !batch.includes(p)); store(LS.pending, pending);
      const last = batch[batch.length-1];
      banner("ok", `保存しました：${jpDate(last.date)} ${last.cat} ${yen(last.amount)}${last.memo?"（"+last.memo+"）":""}`, last);
    }
  } catch(e){
    banner("bad", failText(e));
  } finally {
    flushing=false; btn.disabled=false; renderPending(); renderRecent();
  }
}
function reason(e){
  if (e.status===-1) return "インターネットにつながっていないようです。";
  if (e.status===0) return "保存先の設定がまだありません。息子さんに知らせてください。";
  if (e.status===401 || e.status===403) return "保存先の鍵（トークン）が使えません。期限切れかもしれません。息子さんに知らせてください。";
  if (e.status===409) return "保存先が同時に更新されました。少し待ってから、もう一度押してください。";
  return `エラー ${e.status} が出ました。息子さんに知らせてください。`;
}
function failText(e){
  return "保存できませんでした。" + reason(e) + (e.status===0 ? "" : " 入力した内容はこのパソコンに残してあるので、次に開いたときに自動で送ります。");
}
function renderPending(){
  const p=$("#pendingPill");
  p.hidden = pending.length===0;
  p.textContent = `未送信 ${pending.length}件（押すと再送）`;
  p.onclick = flushPending;
}

/* ---------- 取り消し ---------- */
function askUndo(btn, entry, after){
  const wrap=document.createElement("span");
  wrap.innerHTML = `<span class="ask">この1件を取り消しますか？</span><button class="undo yes">はい</button> <button class="undo no">いいえ</button>`;
  btn.replaceWith(wrap);
  wrap.querySelector(".no").onclick = () => wrap.replaceWith(btn);
  wrap.querySelector(".yes").onclick = async () => {
    wrap.textContent="取り消しています…";
    try {
      const pi = pending.findIndex(p => p.id===entry.id);
      if (pi>=0){ pending.splice(pi,1); store(LS.pending, pending); }
      else await deleteEntry(entry.date.slice(0,4), entry.id);
      recent = recent.filter(r => r.id!==entry.id); store(LS.recent, recent);
      wrap.textContent="取り消しました";
      $("#banner").hidden=true;
      renderRecent(); renderPending();
      if (after) after();
    } catch(e){ wrap.textContent=""; wrap.appendChild(btn); banner("bad", "取り消せませんでした。"+reason(e)); }
  };
}
function entryRow(e, withDelete){
  const tr=document.createElement("tr");
  tr.innerHTML = `<td>${jpDate(e.date)}</td><td>${esc(e.cat)}</td><td class="num">${yen(e.amount)}</td><td>${esc(e.memo)}</td>` + (withDelete ? `<td class="act"></td>` : "");
  if (withDelete){ const b=document.createElement("button"); b.className="undo"; b.textContent="取り消す"; b.onclick=()=>askUndo(b, e, withDelete===true?null:withDelete); tr.lastElementChild.appendChild(b); }
  return tr;
}
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderRecent(){
  const box=$("#recentBox"); box.innerHTML="";
  const list = [...pending.map(p => ({...p, _pending:true})), ...recent];
  if (!list.length){ box.innerHTML = `<p class="empty">まだありません。上の 1〜4 を入れて「保存」を押してください。</p>`; return; }
  const t=document.createElement("table");
  t.innerHTML = `<thead><tr><th>日付</th><th>費目</th><th class="num">金額</th><th>メモ</th><th></th></tr></thead>`;
  const tb=document.createElement("tbody");
  list.forEach(e => { const tr=entryRow(e, true); if (e._pending) tr.firstElementChild.textContent += "（未送信）"; tb.appendChild(tr); });
  t.appendChild(tb); box.appendChild(t);
}

/* ---------- 集計 ---------- */
let sumY, sumM;   // 表示中の年月
function setMonth(y,m){ if (m<1){y--;m=12;} if (m>12){y++;m=1;} sumY=y; sumM=m; }
{ const d=new Date(); setMonth(d.getFullYear(), d.getMonth()+1); }
$("#prevMonth").onclick = () => { setMonth(sumY, sumM-1); renderSummary(); };
$("#nextMonth").onclick = () => { setMonth(sumY, sumM+1); renderSummary(); };
$("#thisMonth").onclick = () => { const d=new Date(); setMonth(d.getFullYear(), d.getMonth()+1); renderSummary(); };
let sumSeq=0;
async function renderSummary(){
  const seq=++sumSeq;
  $("#monthTitle").textContent = `${sumY}年${sumM}月`;
  const body=$("#sumBody"); body.innerHTML=`<p class="loading">読み込み中…</p>`;
  const prefix = `${sumY}-${pad(sumM)}`;
  try {
    // 直近12か月ぶんの年を読み込む（最大2年）
    const years = new Set([String(sumY), String(sumY-1)]);
    const all = [];
    for (const y of years) all.push(...await loadYear(y));
    if (seq!==sumSeq) return;
    const month = all.filter(e => e.date.startsWith(prefix)).sort((a,b) => a.date.localeCompare(b.date) || (a.created||"").localeCompare(b.created||""));
    body.innerHTML="";
    const total = month.reduce((s,e)=>s+e.amount,0);
    body.insertAdjacentHTML("beforeend", `<div class="total"><span class="lab">${sumY}年${sumM}月の合計</span><span class="cnt">${month.length}件</span><span class="val">${yen(total)}</span></div>`);
    if (!month.length){ body.insertAdjacentHTML("beforeend", `<p class="empty">この月の入力はありません。</p>`); }
    else {
      // 費目別
      const byCat = {}; month.forEach(e => { byCat[e.cat] = byCat[e.cat] || {n:0,s:0}; byCat[e.cat].n++; byCat[e.cat].s+=e.amount; });
      const cats = Object.entries(byCat).sort((a,b)=>b[1].s-a[1].s); const maxCat = Math.max(...cats.map(c=>c[1].s), 1);
      // 日別
      const byDay = {}; month.forEach(e => { byDay[e.date] = byDay[e.date] || {n:0,s:0}; byDay[e.date].n++; byDay[e.date].s+=e.amount; });
      const days = Object.entries(byDay).sort((a,b)=>a[0].localeCompare(b[0]));
      const grid=document.createElement("div"); grid.className="sumgrid";
      grid.innerHTML = `
        <div><h2>費目ごと</h2><table><thead><tr><th>費目</th><th class="num">件数</th><th class="num">金額</th></tr></thead><tbody>
        ${cats.map(([c,v]) => `<tr><td>${esc(c)}<span class="bar" style="width:${Math.max(2, v.s/maxCat*100)}%"></span></td><td class="num">${v.n}</td><td class="num">${yen(v.s)}</td></tr>`).join("")}
        </tbody></table></div>
        <div><h2>日ごと</h2><table><thead><tr><th>日付</th><th class="num">件数</th><th class="num">金額</th></tr></thead><tbody>
        ${days.map(([d,v]) => `<tr><td>${jpDate(d)}</td><td class="num">${v.n}</td><td class="num">${yen(v.s)}</td></tr>`).join("")}
        </tbody></table></div>`;
      body.appendChild(grid);
      // 明細
      const det=document.createElement("details");
      det.innerHTML = `<summary>この月の明細をぜんぶ見る（${month.length}件）</summary>`;
      const t=document.createElement("table");
      t.innerHTML = `<thead><tr><th>日付</th><th>費目</th><th class="num">金額</th><th>メモ</th><th></th></tr></thead>`;
      const tb=document.createElement("tbody");
      month.forEach(e => tb.appendChild(entryRow(e, () => renderSummary())));
      t.appendChild(tb); det.appendChild(t); body.appendChild(det);
    }
    // 月別推移（12か月）
    const rows=[]; let y=sumY, m=sumM;
    for (let i=0;i<12;i++){ const p=`${y}-${pad(m)}`; const es=all.filter(e=>e.date.startsWith(p)); rows.push({p, y, m, n:es.length, s:es.reduce((a,e)=>a+e.amount,0)}); m--; if (m<1){m=12;y--;} }
    const maxM = Math.max(...rows.map(r=>r.s),1);
    const det2=document.createElement("details"); det2.open = true;
    det2.innerHTML = `<summary>月ごとの合計（この月から12か月さかのぼる）</summary>`;
    const t2=document.createElement("table");
    t2.innerHTML = `<thead><tr><th>年月</th><th class="num">件数</th><th class="num">合計</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${r.y}年${r.m}月<span class="bar" style="width:${Math.max(2, r.s/maxM*100)}%"></span></td><td class="num">${r.n}</td><td class="num">${yen(r.s)}</td></tr>`).join("")}</tbody>`;
    det2.appendChild(t2); body.appendChild(det2);
  } catch(e){
    if (seq!==sumSeq) return;
    body.innerHTML = `<p class="problem" style="display:block">集計を読み込めませんでした。${esc(reason(e))}</p>`;
  }
}

/* ---------- 設定 ---------- */
function fillSettings(){
  $("#owner").value=settings.owner||""; $("#repo").value=settings.repo||""; $("#branch").value=settings.branch||"main"; $("#token").value=settings.token||"";
  $("#setStatus").hidden=true;
}
$("#saveSettings").onclick = async () => {
  settings = { owner:$("#owner").value.trim(), repo:$("#repo").value.trim(), branch:$("#branch").value.trim()||"main", token:$("#token").value.trim() };
  store(LS.settings, settings);
  Object.keys(yearCache).forEach(k => delete yearCache[k]);
  const st=$("#setStatus"); st.hidden=false; st.className="status"; st.textContent="確認しています…";
  try {
    const r = await gh(`/repos/${settings.owner}/${settings.repo}`);
    if (!r) throw ghErr(404,"github");
    const y = new Date().getFullYear();
    const f = await getFile(y);
    st.className="status ok";
    st.textContent = `接続できました（${settings.owner}/${settings.repo}）。${y}年のファイルは${f ? "あります" : "まだ無いので、最初の保存時に作られます"}。`;
  } catch(e){
    st.className="status bad";
    st.textContent = e.status===401 ? "トークンが正しくないか、期限切れです。" : e.status===404 ? "リポジトリが見つかりません。ユーザー名・リポジトリ名・トークンの権限を確認してください。" : e.status===-1 ? "インターネットにつながっていません。" : `確認できませんでした（エラー ${e.status}）。`;
  }
};
$("#flushNow").onclick = async () => { await flushPending(); show("input"); };

/* ---------- 起動 ---------- */
renderPending(); renderRecent();
if (!settings.token) show("set");
else if (pending.length) flushPending();
</script>
</body>
</html>
